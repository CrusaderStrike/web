<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Confirm your Crusader Strike early-access signup.">
  <meta name="theme-color" content="#0b0907">
  <meta name="robots" content="noindex">
  <title>Confirm signup — Crusader Strike</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/landing.css">
</head>
<body>
  <a class="cs-skip-link" href="#main">Skip to content</a>
  <header class="cs-wrap cs-header">
    <a class="cs-brand" href="../index.html">
      <img src="../assets/logo.svg" width="40" height="40" alt="">
      <span>Crusader Strike</span>
    </a>
    <nav aria-label="Primary">
      <ul class="cs-nav">
        <li><a href="../index.html#signup">Sign up</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="cs-wrap">
    <div class="cs-card confirm-panel">
      <div class="hero-mark" aria-hidden="true">
        <img src="../assets/logo.svg" width="120" height="120" alt="">
      </div>
      <h1 class="cs-display">Confirm your email</h1>
      <p class="cs-muted">Click the button below to finish double opt-in. We wait for your click so email link prefetchers do not confirm for you.</p>
      <p class="cs-form-status" id="confirm-status" role="status" aria-live="polite" style="min-height:2rem"></p>
      <div class="cta-row" style="justify-content:center;margin-top:1rem">
        <button type="button" class="cs-btn cs-btn-primary" id="confirm-btn">Confirm signup</button>
      </div>
      <div id="confirm-action" class="cta-row" style="justify-content:center;margin-top:1rem"></div>
    </div>
  </main>

  <footer class="cs-wrap cs-footer">
    <span>© Crusader Strike</span>
    <span><a href="../index.html#signup">Back to signup</a></span>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/confirm.js"></script>
</body>
</html>
